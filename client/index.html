<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>My Struggle minigames</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/main.js"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/">My Struggle <span>minigames</span></a></header>
  <main>
    <p id="error" class="notice error" role="alert" hidden></p>
    <p id="connection" class="notice" role="status">Načítání…</p>

    <section id="identity" class="panel" hidden aria-label="Vstup do hry">
      <form id="name-form">
        <label for="name">Jméno hráče</label>
        <div class="form-row"><input id="name" name="name" autocomplete="nickname" placeholder="Třeba Martin" required><button type="submit">Pokračovat <span aria-hidden="true">→</span></button></div>
        <small>1–20 znaků</small>
      </form>
    </section>

    <section id="choices" hidden aria-label="Výběr lobby">
      <p class="welcome">Hráč: <strong id="player-name"></strong></p>
      <div class="choices-grid">
        <div class="panel choice"><button id="create" type="button">Vytvořit lobby <span aria-hidden="true">+</span></button></div>
        <div class="panel choice"><form id="join-form"><label for="code-input">Kód lobby</label><input id="code-input" name="code" placeholder="ABC123" autocomplete="off" spellcheck="false" required><button type="submit">Připojit se do lobby <span aria-hidden="true">→</span></button></form></div>
      </div>
    </section>

    <section id="lobby" class="panel" hidden aria-labelledby="lobby-title">
      <div class="lobby-heading"><h1 id="lobby-title">Lobby</h1><div class="invite"><span>KÓD LOBBY</span><div class="code-row"><strong id="lobby-code"></strong><button id="copy-code" class="copy-button" type="button" aria-label="Kopírovat kód lobby">Kopírovat</button></div><span id="copy-status" class="sr-only" role="status"></span></div></div>
      <div id="lobby-settings" class="lobby-settings"><label for="round-count">Počet kol</label><select id="round-count"></select></div>
      <section id="match-panel" class="match-panel" hidden aria-label="Zápas">
        <p id="match-round" class="match-round"></p>
        <h2 id="minigame-name"></h2>
        <p id="minigame-rules"></p>
        <div class="phase-row"><h3 id="match-phase" role="status"></h3><span id="phase-timer"><span id="phase-time"></span></span></div>
        <p id="game-message"></p>
        <div id="race-panel" hidden>
          <div class="race-hud"><strong>Čas <span id="race-time">0:00</span></strong><span id="race-progress"></span><span id="race-catchup"></span></div>
          <div id="race-canvas" class="race-canvas"></div>
          <div id="race-countdown" class="race-countdown" role="status"></div>
          <p id="race-status" role="status"></p>
          <ol id="race-order" class="race-order" aria-label="Průběžné pořadí závodu"></ol>
          <button id="race-leave" class="secondary" type="button">Opustit lobby</button>
        </div>
        <div id="worms-panel" hidden>
          <div id="worms-canvas"></div>
          <div class="worms-hud">
            <div class="worms-turn"><strong id="worms-active"></strong><strong id="worms-time"></strong><span id="worms-stamina"></span><label><span id="worms-power-label">Síla: 0 %</span><progress id="worms-power" max="100" value="0" aria-label="Síla výstřelu"></progress></label><button id="worms-end" type="button">Ukončit tah</button></div>
            <p id="worms-players" aria-label="Stav postav"></p>
          </div>
          <div id="worms-countdown" class="race-countdown" role="status"></div>
          <p id="worms-help" role="status"></p>
          <button id="worms-leave" class="secondary" type="button">Opustit lobby</button>
        </div>
        <button id="dev-finish" class="secondary" type="button" hidden>Vyhodnotit testovací kolo</button>
        <div id="match-results" class="results-scroll" hidden><p id="winner" hidden></p><table><thead><tr><th>Pořadí</th><th>Hráč</th><th>Body kola</th><th>Celkem</th><th>Výsledek</th></tr></thead><tbody id="scores"></tbody></table></div>
      </section>
      <div class="list-heading"><h3>Hráči <span id="count"></span></h3><span>STAV</span></div>
      <ul id="players" aria-label="Hráči v lobby"></ul>
      <div class="lobby-bottom"><p id="lobby-hint" role="status"></p><button id="ready" type="button">Jsem připraven/a</button></div>
      <button id="leave" class="text-button" type="button">Opustit lobby</button>
    </section>
  </main>
</body>
</html>
